<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>VoltRide</title>
    <style>
      :root {
        --paper: #f4f3ed;
        --ink: #17231e;
        --muted: #53615a;
        --green: #245c46;
        --lime: #d5f277;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--paper);
        color: var(--ink);
        font-family: Arial, sans-serif;
      }
      .card {
        max-width: 620px;
        padding: 32px 28px;
        border: 1px solid #d9ddd2;
        background: rgba(255,255,255,0.36);
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3rem);
      }
      p {
        margin: 0 0 16px;
        line-height: 1.6;
        color: var(--muted);
      }
      a {
        display: inline-block;
        padding: 12px 18px;
        background: var(--green);
        color: white;
        text-decoration: none;
        font-weight: 700;
        border-radius: 999px;
      }
      a:hover { background: #183f31; }
      .hint {
        margin-top: 10px;
        font-size: 0.9rem;
      }
    </style>
    <meta http-equiv="refresh" content="3; url=http://localhost:3010" />
  </head>
  <body>
    <main class="card">
      <h1>VoltRide</h1>
      <p>A aplicação precisa de ser aberta pelo servidor local para funcionar corretamente.</p>
      <p><a href="http://localhost:3010">Abrir http://localhost:3010</a></p>
      <p class="hint">Se abrir este ficheiro diretamente, o browser bloqueia por segurança. Use o servidor local em vez de abrir o arquivo bruto.</p>
    </main>
  </body>
</html>
